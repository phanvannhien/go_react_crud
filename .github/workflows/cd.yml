# .github/workflows/cd.yml
name: CD - Build & Push Docker

on:
  push:
    branches: [ "develop", "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set Tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build Backend
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME_BACKEND}:${{ steps.vars.outputs.tag }} -f Dockerfile.backend .

      - name: Build Frontend
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME_FRONTEND}:${{ steps.vars.outputs.tag }} -f Dockerfile.frontend ./ui

      - name: Push Backend
        run: docker push $REGISTRY/${IMAGE_NAME_BACKEND}:${{ steps.vars.outputs.tag }}

      - name: Push Frontend
        run: docker push $REGISTRY/${IMAGE_NAME_FRONTEND}:${{ steps.vars.outputs.tag }}